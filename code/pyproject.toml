[project]
name = "looped-scaling"
version = "0.1.0"
description = "Controlled small-scale scaling study of looped / recurrent-depth transformers"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "scipy>=1.11",
  "pyyaml>=6.0",
  "pandas>=2.0",
  "tokenizers>=0.19",
  "huggingface_hub>=0.23",
  "pyarrow>=15",
  "tqdm>=4.66",
  "matplotlib>=3.8",
  "setuptools>=65",   # needed by torch.compile (inductor C++ builds, Triton's launcher); uv venvs do not ship it
]

[tool.setuptools]
packages = ["looped"]
